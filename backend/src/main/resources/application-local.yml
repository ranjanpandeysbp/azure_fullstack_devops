# ─────────────────────────────────────────────────────────────
# LOCAL PROFILE — Uses H2 in-memory database (no setup needed!)
# Run with: java -jar app.jar --spring.profiles.active=local
#        or: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:file:~/h2/employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#  sql:
#    init:
#      mode: always
#      data-locations: classpath:onedata-local.txt

logging:
  level:
    com.azure.demo: DEBUG
    org.hibernate.SQL: DEBUG
