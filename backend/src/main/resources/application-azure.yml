# ─────────────────────────────────────────────────────────────
# AZURE PROFILE — Azure SQL Database
# Secrets injected from Azure Key Vault via App Service config
# Run with: SPRING_PROFILES_ACTIVE=azure
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${AZURE_SQL_URL}
    username: ${AZURE_SQL_USERNAME}
    password: ${AZURE_SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-frontend.azurewebsites.net}

logging:
  level:
    com.azure.demo: INFO
    org.springframework.web: WARN
